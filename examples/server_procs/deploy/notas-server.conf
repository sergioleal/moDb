# Configuração do notas-server (modb::server_host, PLANO_SERVIDOR_PROCS S5.1).
# Uma chave por linha, `chave = valor`; `#` comenta. As flags da linha de
# comando (--port 7600 ...) valem mais que este arquivo.
# Caminhos relativos são relativos à pasta deste arquivo.

db = dados/notas.modb
host = 127.0.0.1
port = 7474

# Atrás de um modb-proxy (ADR-028; notas-proxy.conf): o engine escuta só no
# socket local, e o TCP direto fica desligado (tcp = on o mantém, na transição).
# local = /run/notas-server/engine.sock
# secret_file = /etc/notas-server/link.secret

# Streams simultâneos por conexão e tempo até fechar uma conexão ociosa.
max_streams = 16
idle_timeout_ms = 30000

# Uma chamada de proc que passar disto falha com operation_timeout e é desfeita.
proc_timeout_ms = 5000

# Uma linha por chamada (instante UTC, proc, modo, duração, ok/erro).
# Vazio = stderr (journald, no systemd); "off" = sem log.
log = notas-calls.log
