# Configuração do modb-proxy na frente do notas-server (ADR-028, PLANO_PROXY X9).
# Uma chave por linha, `chave = valor`; `#` comenta. As flags da linha de
# comando valem mais que este arquivo. Caminhos relativos são relativos à pasta
# deste arquivo.

# O socket local do engine (a chave `local` do notas-server.conf) e o segredo
# do link, o mesmo arquivo nos dois lados.
engine = /run/notas-server/engine.sock
secret_file = /etc/notas-server/link.secret

# Onde os clientes conectam.
host = 0.0.0.0
port = 7474

# Tokens dos clientes: `modb-proxy hash-token <token> <principal> [roles]`
# imprime cada linha. Sem esta chave, o proxy não pede autenticação.
tokens = notas-proxy.tokens

# passthrough, ou read_only (só procs de leitura; o catálogo vem do engine).
policy = passthrough
# allowlist = notas-proxy.allow

# Limites por principal (anônimos: por máquina); 0 = sem limite.
max_calls_per_second = 200
max_streams_per_principal = 8

# Uma linha por pedido; stderr vai para o journald no systemd.
audit = stderr

idle_timeout_ms = 30000
